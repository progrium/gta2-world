name = "gta2-signal"
main = "src/index.ts"
compatibility_date = "2025-11-01"

[vars]
# Pages allowed to call the Worker, comma-separated, e.g. "https://<user>.github.io".
ALLOWED_ORIGINS = "https://progrium.github.io"
# `npm run dev` overrides this to "true" so localhost pages work.
ALLOW_LOCALHOST = "false"

# Secrets (never in this file): wrangler secret put TURN_KEY_ID / TURN_KEY_API_TOKEN

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
