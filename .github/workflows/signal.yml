name: Deploy signalling Worker to Cloudflare

# Deploys signal/ (WebRTC rooms and TURN credentials for browser-hosted games).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and
# optionally TURN_KEY_ID and TURN_KEY_API_TOKEN (without them the Worker hands
# out STUN only).

on:
  push:
    branches: [main]
    paths: ["signal/**", ".github/workflows/signal.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
    defaults:
      run:
        working-directory: signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Deploy
        run: npx wrangler deploy
      - name: TURN secrets
        if: env.TURN_KEY_ID != '' && env.TURN_KEY_API_TOKEN != ''
        run: |
          printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
          printf '%s' "$TURN_KEY_API_TOKEN" | npx wrangler secret put TURN_KEY_API_TOKEN
      - name: TURN API check (status and response shape only, no credentials printed)
        if: env.TURN_KEY_ID != '' && env.TURN_KEY_API_TOKEN != ''
        run: |
          code=$(curl -s -o /tmp/turn.json -w '%{http_code}' -X POST "https://rtc.live.cloudflare.com/v1/turn/keys/$TURN_KEY_ID/credentials/generate-ice-servers" -H "Authorization: Bearer $TURN_KEY_API_TOKEN" -H "Content-Type: application/json" -d '{"ttl":3600}')
          echo "HTTP $code"
          node -e 'const t=require("fs").readFileSync("/tmp/turn.json","utf8"); try { const j=JSON.parse(t); const r=(v)=>v&&typeof v==="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,(k==="username"||k==="credential")?"<redacted>":Array.isArray(x)?x.map(r):r(x)])):v; console.log(JSON.stringify(r(j))); } catch { console.log(t.slice(0,300)); }'
      - name: Smoke check (room, host welcome, TURN entries)
        run: |
          node -e '
          const base = "https://gta2-signal.proteco.workers.dev";
          const o = { headers: { Origin: "https://progrium.github.io" } };
          (async () => {
            const r = await fetch(base + "/rooms", { method: "POST", ...o });
            const { room } = await r.json();
            console.log("POST /rooms", r.status, room);
            const ws = new WebSocket(base.replace("https", "wss") + "/r/" + room + "?role=host", o);
            const m = await new Promise((res, rej) => { ws.onmessage = (e) => res(JSON.parse(e.data)); ws.onerror = rej; setTimeout(() => rej(new Error("no welcome")), 10000); });
            const urls = (m.ice?.iceServers ?? []).flatMap((s) => [].concat(s.urls));
            console.log("welcome", m.type, m.role, "ice urls:", urls.join(" "));
            ws.close();
            if (m.type !== "welcome") process.exit(1);
            if (!urls.some((u) => u.startsWith("turn"))) console.log("::warning::no TURN servers in the welcome (STUN only)");
          })().catch((e) => { console.error(e); process.exit(1); });'
