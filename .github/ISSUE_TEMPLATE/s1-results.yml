name: "S1 results: Does the map look right, and run at 60 fps?"
description: Send your results from the S1 map viewer test page.
title: "S1 results"
labels: ["results", "s1"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The test page is at https://progrium.github.io/gta2-world/s1/
  - type: textarea
    id: results
    attributes:
      label: Results file
      description: Drag the .json file you downloaded from the test page into this box. If it will not attach, open the file in a text editor and paste its contents here instead.
      placeholder: Drop gta2-s1-....json here
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag screenshots of anything that looked wrong into this box, with a note on where it was.

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Optional. Anything you want Jeff to know that is not in the file.
