name: "S2 results: Same results in every browser?"
description: Send your results from the S2 sim determinism test page.
title: "S2 results"
labels: ["results", "s2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The test page is at https://progrium.github.io/gta2-world/s2/
  - type: textarea
    id: results
    attributes:
      label: Results
      description: The test page's Submit button fills this in, or copies the results for you to paste here. Please paste the text rather than attaching the .json file. Attached files can't be read by the tools that score results.
      placeholder: Paste the results here
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Optional. Anything you want Jeff to know that is not in the file.
