name: "S2 results: Same results in every browser?"
description: Send your results from the S2 sim determinism test page.
title: "S2 results"
labels: ["results", "s2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The test page is at https://progrium.github.io/gta2-world/s2/
  - type: textarea
    id: results
    attributes:
      label: Results file
      description: Drag the .json file you downloaded from the test page into this box. If it will not attach, open the file in a text editor and paste its contents here instead.
      placeholder: Drop gta2-s2-....json here
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Optional. Anything you want Jeff to know that is not in the file.
